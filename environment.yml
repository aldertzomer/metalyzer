name: metalyzer
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pandas
  - pycountry
  - transformers>=5.3,<6
  # DeBERTa tokenizer loading/conversion.
  - sentencepiece
  - protobuf
  # Select CUDA-enabled PyTorch; let Conda resolve its runtime dependencies.
  - pytorch-gpu>=2.10,<3
  # Local taxonomy lookup/download and unittest use the Python standard library.
