name: metalyzer-cpu
channels:
  - conda-forge
dependencies:
  # Python 3.11 is supported by PyTorch and the project's Python >=3.10 requirement.
  - python=3.11
  - pandas
  - pycountry
  - transformers>=5.3,<6
  # DeBERTa tokenizer loading/conversion.
  - sentencepiece
  - protobuf
  # This metapackage forces conda-forge to select a CPU PyTorch build.
  - pytorch-cpu>=2.10,<3
  # Local taxonomy lookup/download and unittest use the Python standard library.
